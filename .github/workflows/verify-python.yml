name: Verify Python distribution
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: node release/check-pinned-keys.mjs . python release/keys.json
      - name: Stage exact unsigned npm input; production signing happens in a protected job
        run: |
          mkdir -p unsigned/npm
          npm pack --pack-destination unsigned/npm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-npm
          path: unsigned/npm/*.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-preserve
          path: release/worktrust-preserve-kit.zip
          if-no-files-found: error
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            architecture: x64
            target: linux-x64
          - os: ubuntu-24.04-arm
            architecture: arm64
            target: linux-arm64
          - os: macos-15-intel
            architecture: x64
            target: darwin-x64
          - os: macos-15
            architecture: arm64
            target: darwin-arm64
          - os: windows-2025
            architecture: x64
            target: win-x64
          - os: windows-11-arm
            architecture: arm64
            target: win-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
      - run: python -m pip install -r python/requirements-release.txt
      - run: node tests/test-cli-execution-boundary.mjs
        env:
          WORKTRUST_TEST_CLI_SOURCE: .
      - name: Prepare isolated Linux secret service
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-tools gnome-keyring dbus-x11
      - name: Native OS credential storage (Linux disposable vault)
        if: runner.os == 'Linux'
        env:
          WORKTRUST_TEST_CLI_SOURCE: .
        run: >-
          dbus-run-session -- bash -c 'printf "worktrust-ci-only" | gnome-keyring-daemon --unlock --components=secrets;
          node tests/test-cli-native-keystore.mjs'
      - name: Prepare disposable macOS test keychain
        if: runner.os == 'macOS'
        run: |
          security create-keychain -p worktrust-ci-only "$RUNNER_TEMP/worktrust-test.keychain-db"
          security unlock-keychain -p worktrust-ci-only "$RUNNER_TEMP/worktrust-test.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/worktrust-test.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/worktrust-test.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/worktrust-test.keychain-db"
      - name: Native OS credential storage (disposable item)
        if: runner.os != 'Linux'
        env:
          WORKTRUST_TEST_CLI_SOURCE: .
        run: node tests/test-cli-native-keystore.mjs
      - run: python python/tests/test_runtime_build.py
      - run: python python/build_runtime.py --target ${{ matrix.target }}
      - name: Coupling survives removal of the tool-runner cache
        env:
          WORKTRUST_TEST_CLI_SOURCE: ${{ github.workspace }}
        run: >-
          python -c "import json, pathlib, subprocess;
          runtime = pathlib.Path('python/src/worktrust_cli/runtime');
          node = runtime / json.loads((runtime / 'runtime.json').read_text())['executable'];
          subprocess.run([str(node.resolve()), 'tests/test-cli-runtime.mjs'], check=True)"
      - name: Prepare native offline dependency wheels for uvx/pipx smoke
        run: |
          python -m pip download --only-binary=:all: pycryptodomex==3.24.1 -d wheelhouse
      - name: Cross-language startup and signature checks with disposable keys
        env:
          WORKTRUST_TEST_CLI_SOURCE: ${{ github.workspace }}
        run: |
          python python/tests/test_release_signing.py
          python python/tests/test_signing_workflows.py
      - name: Exact source artifact parity and isolated signed-fixture smoke
        env:
          WORKTRUST_TEST_CLI_SOURCE: ${{ github.workspace }}
          WORKTRUST_TEST_WHEELHOUSE: ${{ github.workspace }}/wheelhouse
          WORKTRUST_REQUIRE_TOOL_RUNNERS: '1'
          WORKTRUST_TEST_ARTIFACT_DIR: ${{ github.workspace }}/dist
        run: python python/tests/test_distribution.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-python-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: matrix.target == 'linux-x64'
        with:
          name: unsigned-python-source
          path: dist/*.tar.gz
          if-no-files-found: error
