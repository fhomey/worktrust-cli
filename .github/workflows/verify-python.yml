# Build/test only: six native platforms, no publishing credentials or deployment.
name: Verify Python distribution
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            architecture: x64
            target: linux-x64
          - os: ubuntu-24.04-arm
            architecture: arm64
            target: linux-arm64
          - os: macos-15-intel
            architecture: x64
            target: darwin-x64
          - os: macos-15
            architecture: arm64
            target: darwin-arm64
          - os: windows-2025
            architecture: x64
            target: win-x64
          - os: windows-11-arm
            architecture: arm64
            target: win-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
      - run: python -m pip install -r python/requirements-release.txt
      - name: Refuse invalid runtime archives and lock metadata
        run: python python/tests/test_runtime_build.py
      - name: Stage pinned official Node for the wheel at build time
        run: python python/build_runtime.py --target ${{ matrix.target }}
      - name: Coupling survives removal of the tool-runner cache
        env:
          WORKTRUST_TEST_CLI_SOURCE: ${{ github.workspace }}
        run: >-
          python -c "import json, pathlib, subprocess;
          runtime = pathlib.Path('python/src/worktrust_cli/runtime');
          node = runtime / json.loads((runtime / 'runtime.json').read_text())['executable'];
          subprocess.run([str(node.resolve()), 'tests/test-cli-runtime.mjs'], check=True)"
      - name: Test real wheel with no Node on PATH, uvx, pipx and evidence parity
        env:
          WORKTRUST_TEST_CLI_SOURCE: ${{ github.workspace }}
          WORKTRUST_REQUIRE_TOOL_RUNNERS: '1'
          WORKTRUST_TEST_ARTIFACT_DIR: ${{ github.workspace }}/dist
        run: python python/tests/test_distribution.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: matrix.target == 'linux-x64'
        with:
          name: python-source
          path: dist/*.tar.gz
          if-no-files-found: error
