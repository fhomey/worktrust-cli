# Publishes `worktrust` to npm with provenance, from this PUBLIC repository (npm provenance requires
# one). npm trusted publishing (OIDC): no npm token exists anywhere; npm trusts this repository and
# this workflow by their identity. Hardened after the security audit of 2026-10-03:
#  - every action is pinned to a full commit, not a movable tag;
#  - npm is pinned to one version (trusted publishing needs npm 11.5.1 or later);
#  - the job runs in the `npm` environment: a person approves every release before it publishes, and
#    the environment only accepts version tags (v*);
#  - the job can read the repository and mint its OIDC identity, nothing else.
name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.21.0
      - run: node --check worktrust.mjs && node --check setup-mcp.mjs && node --check log-session.mjs && node --check count-behaviour.mjs
      - run: node worktrust.mjs help
      - name: The package carries what this commit carries, and nothing that installs or downloads
        run: |
          test "$(node -p "Object.keys(require('./package.json').dependencies ?? {}).length")" = "0"
          test "$(node -p "Object.keys(require('./package.json').scripts ?? {}).length")" = "0"
      - run: npm publish --provenance --access public
