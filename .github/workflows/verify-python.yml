# Runs in the public CLI mirror, with the Python distribution staged at python/.
# Build/test only. Publishing is a separate, protected workflow.
name: Verify Python distribution
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -r python/requirements-release.txt
      - name: Test built wheel, uvx, pipx and canonical module parity
        env:
          WORKTRUST_TEST_CLI_SOURCE: ${{ github.workspace }}
          WORKTRUST_REQUIRE_TOOL_RUNNERS: '1'
        run: |
          export WORKTRUST_TEST_NODE="$(command -v node)"
          python python/tests/test_distribution.py
